name: Update typhoon data and deploy Pages

on:
  push:
    branches: [main]
    paths:
      - 'dist/**'
      - 'scripts/**'
      - '.github/workflows/update-and-deploy.yml'
      - '!dist/data/**'
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: typhoon-pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch Zhejiang typhoon data
        id: fetch
        run: node scripts/fetch-typhoon.mjs
      - name: Commit data changes
        if: steps.fetch.outputs.data_changed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/data/typhoon.json
          git commit -m "data: refresh Zhejiang typhoon feed"
          git push
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

